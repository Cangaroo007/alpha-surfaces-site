<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brochure | Alpha Surfaces</title>
<meta name="description" content="Browse the Alpha Surfaces brochure — collections, technical specifications, and inspiration for your next project.">
<style>
@font-face { font-family: 'Concrette S'; src: url('fonts/Web/ConcretteS-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Concrette S'; src: url('fonts/Web/ConcretteS-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Degular'; src: url('fonts/Degular Normal/Degular/Web/Degular-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Degular'; src: url('fonts/Degular Normal/Degular/Web/Degular-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Degular'; src: url('fonts/Degular Normal/Degular/Web/Degular-Semibold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --olive: #564d22; --cream: #f3f1e6; --white: #ffffff; --black: #000000; --border: rgba(0,0,0,0.1); }

/* Page is a column: nav · brochure (fills viewport minus chrome) · footer.
   The FlippingBook embed sizes itself by its 3:2 aspect ratio, so we give
   the content area a min-height that equals the viewport minus the nav
   (~75px) and footer so the brochure always fills the screen. */
body {
  background: var(--cream);
  color: var(--black);
  font-family: 'Degular', sans-serif;
  font-weight: 400;
  line-height: 1.2;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
a { color: inherit; }
img { display: block; max-width: 100%; }

.brochure-frame {
  width: 100%;
  background: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  min-height: calc(100vh - 75px - 220px); /* nav 75 + desktop footer ~220 */
}
.brochure-frame .fbo-embed {
  display: block;
  width: 100%;
  max-width: 1400px;
}
@media (max-width: 900px) {
  .brochure-frame {
    min-height: calc(100vh - 75px - 50px); /* nav 75 + compact footer ~50 */
    padding: 8px;
  }
}

/* Footer — copied from the standard pages so the column shrinks naturally
   on narrow viewports. */
.footer { background: var(--white); border-top: 1px solid var(--border); padding: 32px 60px 20px; flex-shrink: 0; }
.footer-inner { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 32px; }
.footer-col-heading { font-family: 'Concrette S', serif; font-weight: 700; font-size: 14px; color: var(--black); margin-bottom: 8px; }
.footer-col p, .footer-col a { font-family: 'Degular', sans-serif; font-weight: 400; font-size: 13px; color: var(--black); line-height: 1.55; }
.footer-col a { text-decoration: underline; text-underline-offset: 2px; }
.footer-col a:hover { color: var(--olive); }
.footer-email-form { display: flex; gap: 8px; margin-top: 10px; }
.footer-email-input { flex: 1; border: none; border-bottom: 1px solid var(--border); padding: 6px 0; font-family: 'Degular', sans-serif; font-size: 13px; background: transparent; outline: none; }
.footer-email-btn { background: var(--olive); color: var(--white); border: none; border-radius: 8px; padding: 6px 20px; font-family: 'Degular', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.footer-bottom { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 14px; }
.footer-bottom p { font-family: 'Degular', sans-serif; font-weight: 400; font-size: 11px; letter-spacing: 0.46px; text-transform: uppercase; color: var(--black); }

/* Below ~900px the four-column footer eats too much room. Drop to a single
   compact bar so the brochure keeps a usable viewport. The page still
   doesn't scroll — only the iframe does. */
@media (max-width: 900px) {
  .footer { padding: 14px 18px 12px; }
  .footer-inner { display: none; }
  .footer-bottom { border-top: none; margin-top: 0; padding-top: 0; text-align: center; }
}
</style>

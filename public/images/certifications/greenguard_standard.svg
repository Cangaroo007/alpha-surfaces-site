<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340">
  <defs>
    <clipPath id="inner">
      <circle cx="150" cy="128" r="62"/>
    </clipPath>
  </defs>

  <!-- Grey rounded rect bg -->
  <rect width="300" height="340" rx="28" ry="28" fill="#808080"/>
  
  <!-- White circle -->
  <circle cx="150" cy="128" r="72" fill="none" stroke="#FFF" stroke-width="14"/>
  
  <!-- U letter -->
  <text x="148" y="116" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="bold" fill="#FFF" text-anchor="middle">U</text>
  
  <!-- L letter - position it so it stays visible above the white fill -->
  <text x="155" y="148" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" fill="#FFF" text-anchor="middle">L</text>
  
  <!-- Small white curved mound at bottom of circle -->
  <path d="M88,170 Q115,148 145,160 Q175,172 212,170 L212,195 L88,195 Z" 
        fill="#FFF" clip-path="url(#inner)"/>
  
  <!-- Green leaf on the white mound -->
  <g transform="translate(120, 155) rotate(-25) scale(0.8)">
    <path d="M0,18 C-2,8 6,-8 22,-14 C18,-1 12,10 0,18 Z" fill="#808080"/>
    <path d="M2,16 C3,6 9,-1 22,-14" fill="none" stroke="#FFF" stroke-width="1.3"/>
  </g>
  
  <!-- GREENGUARD -->
  <text x="150" y="268" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="bold" fill="#FFF" text-anchor="middle" letter-spacing="2">GREENGUARD</text>
</svg>